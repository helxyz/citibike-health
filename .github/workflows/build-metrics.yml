# Once a day: run data-quality checks, recompute KPI tables, commit them.
name: build-metrics
on:
  schedule:
    - cron: "23 9 * * *"   # ~5am New York
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python pipeline/build_metrics.py
      - name: Commit metrics
        run: |
          git config user.name "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add metrics/
          git commit -m "metrics $(date -u +%Y-%m-%d)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
